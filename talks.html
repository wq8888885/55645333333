<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谈话记录 - 班级助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .talk-list { background: white; border-radius: 12px; padding: 16px; }
    .talk-item { padding: 16px 0; border-bottom: 1px solid var(--border-color); }
    .talk-item:last-child { border-bottom: none; }
    .talk-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .talk-student { font-weight: 600; color: var(--text-primary); }
    .talk-date { font-size: 14px; color: var(--text-secondary); }
    .talk-content { font-size: 14px; color: var(--text-primary); line-height: 1.6; margin-bottom: 8px; }
    .talk-followup { font-size: 13px; color: var(--text-secondary); font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="app-title">谈话记录</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" onclick="addTalk()">+ 新增</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>班级助手</h2>
        <p class="subtitle">绿茵校园·智慧班级</p>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-title">主功能</div>
          <a href="index.html" class="nav-item"><span class="nav-icon"></span><span>主页信息</span></a>
          <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span><span>学生管理</span></a>
          <a href="grades.html" class="nav-item"><span class="nav-icon">📈</span><span>成绩分析</span></a>
          <a href="discipline.html" class="nav-item"><span class="nav-icon">⚖️</span><span>违纪统计</span></a>
          <a href="homework.html" class="nav-item"><span class="nav-icon">📚</span><span>作业管理</span></a>
          <a href="leave.html" class="nav-item"><span class="nav-icon">🗓️</span><span>请销假</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">教学记录</div>
          <a href="worklog.html" class="nav-item"><span class="nav-icon">📝</span><span>工作留痕</span></a>
          <a href="talks.html" class="nav-item active"><span class="nav-icon">💬</span><span>谈话记录</span></a>
          <a href="seating.html" class="nav-item"><span class="nav-icon">🪑</span><span>排座位</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">AI 助手</div>
          <a href="ai-prepare.html" class="nav-item"><span class="nav-icon">🤖</span><span>智能备课</span></a>
          <a href="ai-analysis.html" class="nav-item"><span class="nav-icon">📊</span><span>学情分析</span></a>
          <a href="ai-comment.html" class="nav-item"><span class="nav-icon">✍️</span><span>评语生成</span></a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="teacher-info">
          <div class="teacher-avatar" id="teacherAvatar">李</div>
          <div>
            <div class="teacher-name" id="teacherName">李老师</div>
            <div class="teacher-role" id="teacherRole">班主任</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
      <div class="talk-list" id="talkList">
        <div class="empty-state">暂无谈话记录</div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    if (!classData.className || !classData.teacherName) {
      window.location.href = 'setup.html';
    }

    function updatePage() {
      document.getElementById('teacherName').textContent = (classData.teacherName || '老师') + '老师';
      document.getElementById('teacherRole').textContent = classData.className || '班主任';
      document.getElementById('teacherAvatar').textContent = (classData.teacherName || '老')[0];
      renderTalks();
    }

    function renderTalks() {
      const list = document.getElementById('talkList');
      if (classData.talks.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无谈话记录</div>';
        return;
      }
      list.innerHTML = classData.talks.map(t => {
        const student = classData.students.find(s => s.id === t.studentId);
        return `
          <div class="talk-item">
            <div class="talk-header">
              <div class="talk-student">${student ? student.name : '未知学生'}</div>
              <div class="talk-date">${t.date}</div>
            </div>
            <div class="talk-content">${t.content}</div>
            ${t.followup ? `<div class="talk-followup">后续：${t.followup}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function addTalk() {
      if (classData.students.length === 0) {
        alert('请先添加学生');
        return;
      }
      const studentId = parseInt(prompt('学生 ID（查看学生管理页面获取）：'));
      const student = classData.students.find(s => s.id === studentId);
      if (!student) {
        alert('学生不存在');
        return;
      }
      const content = prompt('谈话内容：');
      if (!content) return;
      const followup = prompt('后续跟进（可选）：', '');
      
      classData.talks.push({
        id: Date.now(),
        studentId,
        content,
        followup,
        date: new Date().toISOString().split('T')[0]
      });
      saveData();
      renderTalks();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    updatePage();
  </script>
</body>
</html>
