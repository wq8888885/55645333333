<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>备份管理 - 班级助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .backup-container { background: white; border-radius: 12px; padding: 16px; }
    .backup-actions { display: flex; gap: 12px; margin-bottom: 24px; }
    .backup-btn { flex: 1; padding: 16px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .export-btn { background: var(--primary-color); color: white; }
    .import-btn { background: var(--bg-color); color: var(--text-primary); }
    .backup-btn:hover { transform: translateY(-2px); }
    .backup-info { padding: 16px; background: var(--bg-color); border-radius: 8px; margin-bottom: 16px; }
    .backup-info h4 { margin: 0 0 8px 0; color: var(--text-primary); }
    .backup-info p { margin: 0; color: var(--text-secondary); font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="app-title">备份管理</h1>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>班级助手</h2>
        <p class="subtitle">绿茵校园·智慧班级</p>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-title">主功能</div>
          <a href="index.html" class="nav-item"><span class="nav-icon"></span><span>主页信息</span></a>
          <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span><span>学生管理</span></a>
          <a href="grades.html" class="nav-item"><span class="nav-icon">📈</span><span>成绩分析</span></a>
          <a href="discipline.html" class="nav-item"><span class="nav-icon">⚖️</span><span>违纪统计</span></a>
          <a href="homework.html" class="nav-item"><span class="nav-icon">📚</span><span>作业管理</span></a>
          <a href="leave.html" class="nav-item"><span class="nav-icon">🗓️</span><span>请销假</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">教学记录</div>
          <a href="worklog.html" class="nav-item"><span class="nav-icon">📝</span><span>工作留痕</span></a>
          <a href="talks.html" class="nav-item"><span class="nav-icon">💬</span><span>谈话记录</span></a>
          <a href="seating.html" class="nav-item"><span class="nav-icon">🪑</span><span>排座位</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">AI 助手</div>
          <a href="ai-prepare.html" class="nav-item"><span class="nav-icon"></span><span>智能备课</span></a>
          <a href="ai-analysis.html" class="nav-item"><span class="nav-icon"></span><span>学情分析</span></a>
          <a href="ai-comment.html" class="nav-item"><span class="nav-icon">✍️</span><span>评语生成</span></a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="teacher-info">
          <div class="teacher-avatar" id="teacherAvatar">李</div>
          <div>
            <div class="teacher-name" id="teacherName">李老师</div>
            <div class="teacher-role" id="teacherRole">班主任</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
      <div class="backup-container">
        <div class="backup-info">
          <h4>数据备份</h4>
          <p>导出所有数据为 JSON 文件，包含学生、成绩、作业、违纪等全部信息</p>
        </div>
        
        <div class="backup-actions">
          <button class="backup-btn export-btn" onclick="exportData()">📥 导出数据</button>
          <button class="backup-btn import-btn" onclick="importData()"> 导入数据</button>
        </div>

        <div class="backup-info">
          <h4>当前数据统计</h4>
          <p id="statsInfo">加载中...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    if (!classData.className || !classData.teacherName) {
      window.location.href = 'setup.html';
    }

    function updatePage() {
      document.getElementById('teacherName').textContent = (classData.teacherName || '老师') + '老师';
      document.getElementById('teacherRole').textContent = classData.className || '班主任';
      document.getElementById('teacherAvatar').textContent = (classData.teacherName || '老')[0];
      
      const stats = `学生：${classData.students.length} 人 | 成绩：${classData.grades.length} 条 | 作业：${classData.homework.length} 份 | 违纪：${classData.discipline.length} 条`;
      document.getElementById('statsInfo').textContent = stats;
    }

    function exportData() {
      const dataStr = JSON.stringify(classData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `班级助手备份_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      alert('数据已导出');
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (confirm('导入数据将覆盖当前所有数据，确定继续？')) {
              classData = data;
              saveData();
              alert('数据导入成功');
              updatePage();
            }
          } catch (err) {
            alert('导入失败：文件格式错误');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    updatePage();
  </script>
</body>
</html>
