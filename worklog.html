<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班级助手 - 工作留痕</title>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF8C69; --primary-light: #FFA88C;
      --bg: #FFF8F0; --bg-card: #FFFFFF; --bg-cream: #FFF5EB;
      --text-primary: #2D2D2D; --text-secondary: #6B6B6B; --text-muted: #999999;
      --border: #FFE8D6; --success: #4CAF50; --warning: #FF9800; --error: #F44336;
      --info: #2196F3; --shadow: 0 2px 12px rgba(255, 140, 105, 0.08);
      --radius: 16px; --radius-sm: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text-primary); min-height: 100vh; padding-bottom: 80px;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(255, 140, 105, 0.2);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .header-title { color: white; font-size: 18px; font-weight: 600; }
    .add-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .content { padding: 16px; }
    .worklog-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .worklog-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .worklog-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .worklog-icon.meeting { background: #E3F2FD; color: var(--info); }
    .worklog-icon.activity { background: #E8F5E9; color: var(--success); }
    .worklog-icon.parent { background: #FFF3E0; color: var(--warning); }
    .worklog-title { font-size: 15px; font-weight: 600; flex: 1; }
    .worklog-time { font-size: 12px; color: var(--text-muted); }
    .worklog-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }
    .worklog-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag {
      padding: 3px 8px; border-radius: 10px; font-size: 11px;
      background: var(--bg-cream); color: var(--text-secondary);
    }
    .worklog-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .worklog-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); }
    .worklog-action { font-size: 13px; color: var(--primary); cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="header-title">工作留痕</div>
    </div>
    <button class="add-btn" onclick="addWorklog()">
      <i data-lucide="plus" class="w-5 h-5"></i>
    </button>
  </header>

  <div class="content">
    <div class="worklog-card">
      <div class="worklog-header">
        <div class="worklog-icon meeting">
          <i data-lucide="users" class="w-5 h-5"></i>
        </div>
        <div class="worklog-title">班会课 - 安全教育</div>
        <div class="worklog-time">今天 14:00</div>
      </div>
      <div class="worklog-desc">
        开展"交通安全"主题班会，通过案例分析让学生了解交通规则的重要性。学生参与度高，讨论积极。
      </div>
      <div class="worklog-tags">
        <span class="tag">班会</span>
        <span class="tag">安全教育</span>
        <span class="tag">三年级 2 班</span>
      </div>
      <div class="worklog-footer">
        <div class="worklog-meta">
          <span>42 人参加</span>
          <span>·</span>
          <span>已归档</span>
        </div>
        <span class="worklog-action">编辑 ›</span>
      </div>
    </div>

    <div class="worklog-card">
      <div class="worklog-header">
        <div class="worklog-icon activity">
          <i data-lucide="trophy" class="w-5 h-5"></i>
        </div>
        <div class="worklog-title">运动会组织</div>
        <div class="worklog-time">2026-05-10</div>
      </div>
      <div class="worklog-desc">
        组织班级参加学校春季运动会，获得团体总分第二名。表扬张小明、李华等同学在比赛中的突出表现。
      </div>
      <div class="worklog-tags">
        <span class="tag">活动</span>
        <span class="tag">运动会</span>
        <span class="tag">获奖</span>
      </div>
      <div class="worklog-footer">
        <div class="worklog-meta">
          <span>42 人参加</span>
          <span>·</span>
          <span>已归档</span>
        </div>
        <span class="worklog-action">编辑 ›</span>
      </div>
    </div>

    <div class="worklog-card">
      <div class="worklog-header">
        <div class="worklog-icon parent">
          <i data-lucide="phone" class="w-5 h-5"></i>
        </div>
        <div class="worklog-title">家长沟通 - 王芳家长</div>
        <div class="worklog-time">2026-05-08</div>
      </div>
      <div class="worklog-desc">
        与王芳妈妈电话沟通，反馈近期学习成绩下滑情况。家长表示会加强监督，配合老师工作。约定下周面谈。
      </div>
      <div class="worklog-tags">
        <span class="tag">家长沟通</span>
        <span class="tag">电话</span>
        <span class="tag">待跟进</span>
      </div>
      <div class="worklog-footer">
        <div class="worklog-meta">
          <span>已记录</span>
          <span>·</span>
          <span>待跟进</span>
        </div>
        <span class="worklog-action">编辑 ›</span>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function addWorklog() { alert('添加工作留痕功能'); }
  </script>
</body>
</html>
