<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作留痕 - 班级助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .worklog-list { background: white; border-radius: 12px; padding: 16px; }
    .worklog-item { padding: 16px 0; border-bottom: 1px solid var(--border-color); }
    .worklog-item:last-child { border-bottom: none; }
    .worklog-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .worklog-title { font-weight: 600; color: var(--text-primary); }
    .worklog-date { font-size: 14px; color: var(--text-secondary); }
    .worklog-content { font-size: 14px; color: var(--text-primary); line-height: 1.6; margin-bottom: 8px; }
    .worklog-tag { display: inline-block; padding: 2px 8px; background: var(--primary-color); color: white; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="app-title">工作留痕</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" onclick="addWorklog()">+ 新增</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>班级助手</h2>
        <p class="subtitle">绿茵校园·智慧班级</p>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-title">主功能</div>
          <a href="index.html" class="nav-item"><span class="nav-icon"></span><span>主页信息</span></a>
          <a href="students.html" class="nav-item"><span class="nav-icon">‍🎓</span><span>学生管理</span></a>
          <a href="grades.html" class="nav-item"><span class="nav-icon">📈</span><span>成绩分析</span></a>
          <a href="discipline.html" class="nav-item"><span class="nav-icon">⚖️</span><span>违纪统计</span></a>
          <a href="homework.html" class="nav-item"><span class="nav-icon">📚</span><span>作业管理</span></a>
          <a href="leave.html" class="nav-item"><span class="nav-icon">🗓️</span><span>请销假</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">教学记录</div>
          <a href="worklog.html" class="nav-item active"><span class="nav-icon">📝</span><span>工作留痕</span></a>
          <a href="talks.html" class="nav-item"><span class="nav-icon">💬</span><span>谈话记录</span></a>
          <a href="seating.html" class="nav-item"><span class="nav-icon">🪑</span><span>排座位</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">AI 助手</div>
          <a href="ai-prepare.html" class="nav-item"><span class="nav-icon">🤖</span><span>智能备课</span></a>
          <a href="ai-analysis.html" class="nav-item"><span class="nav-icon">📊</span><span>学情分析</span></a>
          <a href="ai-comment.html" class="nav-item"><span class="nav-icon">✍️</span><span>评语生成</span></a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="teacher-info">
          <div class="teacher-avatar" id="teacherAvatar">李</div>
          <div>
            <div class="teacher-name" id="teacherName">李老师</div>
            <div class="teacher-role" id="teacherRole">班主任</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
      <div class="worklog-list" id="worklogList">
        <div class="empty-state">暂无工作记录</div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    if (!classData.className || !classData.teacherName) {
      window.location.href = 'setup.html';
    }

    function updatePage() {
      document.getElementById('teacherName').textContent = (classData.teacherName || '老师') + '老师';
      document.getElementById('teacherRole').textContent = classData.className || '班主任';
      document.getElementById('teacherAvatar').textContent = (classData.teacherName || '老')[0];
      renderWorklogs();
    }

    function renderWorklogs() {
      const list = document.getElementById('worklogList');
      if (classData.worklogs.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无工作记录</div>';
        return;
      }
      list.innerHTML = classData.worklogs.map(w => `
        <div class="worklog-item">
          <div class="worklog-header">
            <div class="worklog-title">${w.title}</div>
            <div class="worklog-date">${w.date}</div>
          </div>
          <div class="worklog-content">${w.content}</div>
          <span class="worklog-tag">${w.category}</span>
        </div>
      `).join('');
    }

    function addWorklog() {
      const title = prompt('工作标题：');
      if (!title) return;
      const category = prompt('分类（教学/管理/会议/其他）：', '教学');
      const content = prompt('工作内容：');
      if (!content) return;
      
      classData.worklogs.push({
        id: Date.now(),
        title,
        category,
        content,
        date: new Date().toISOString().split('T')[0]
      });
      saveData();
      renderWorklogs();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    updatePage();
  </script>
</body>
</html>
