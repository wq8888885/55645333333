<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班级助手 - 请销假</title>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF8C69; --primary-light: #FFA88C;
      --bg: #FFF8F0; --bg-card: #FFFFFF; --bg-cream: #FFF5EB;
      --text-primary: #2D2D2D; --text-secondary: #6B6B6B; --text-muted: #999999;
      --border: #FFE8D6; --success: #4CAF50; --warning: #FF9800; --error: #F44336;
      --info: #2196F3; --shadow: 0 2px 12px rgba(255, 140, 105, 0.08);
      --radius: 16px; --radius-sm: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text-primary); min-height: 100vh; padding-bottom: 80px;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(255, 140, 105, 0.2);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .header-title { color: white; font-size: 18px; font-weight: 600; }
    .add-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .content { padding: 16px; }
    .leave-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .leave-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .leave-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--info) 0%, #42A5F5 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 16px; font-weight: 600;
    }
    .leave-info { flex: 1; }
    .leave-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .leave-type { font-size: 12px; color: var(--text-muted); }
    .leave-status {
      padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    }
    .status-pending { background: #FFF3E0; color: var(--warning); }
    .status-approved { background: #E8F5E9; color: var(--success); }
    .status-rejected { background: #FFEBEE; color: var(--error); }
    .leave-details {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .detail-item { font-size: 12px; }
    .detail-label { color: var(--text-muted); margin-bottom: 2px; }
    .leave-actions { display: flex; gap: 8px; }
    .action-btn {
      flex: 1; padding: 8px; border: none; border-radius: var(--radius-sm);
      font-size: 12px; cursor: pointer;
    }
    .btn-approve { background: #E8F5E9; color: var(--success); }
    .btn-reject { background: #FFEBEE; color: var(--error); }
    .btn-detail { background: var(--bg-cream); color: var(--text-secondary); }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="header-title">请销假</div>
    </div>
    <button class="add-btn" onclick="addLeave()">
      <i data-lucide="plus" class="w-5 h-5"></i>
    </button>
  </header>

  <div class="content">
    <div class="leave-card">
      <div class="leave-header">
        <div class="leave-avatar">赵</div>
        <div class="leave-info">
          <div class="leave-name">赵强</div>
          <div class="leave-type">病假 · 今天 08:00 申请</div>
        </div>
        <span class="leave-status status-pending">待审批</span>
      </div>
      <div class="leave-details">
        <div class="detail-item">
          <div class="detail-label">请假时间</div>
          <div>今天 - 明天</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">请假天数</div>
          <div>2 天</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">请假原因</div>
          <div>感冒发烧</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">家长电话</div>
          <div>136****3456</div>
        </div>
      </div>
      <div class="leave-actions">
        <button class="action-btn btn-approve">批准</button>
        <button class="action-btn btn-reject">拒绝</button>
        <button class="action-btn btn-detail">详情</button>
      </div>
    </div>

    <div class="leave-card">
      <div class="leave-header">
        <div class="leave-avatar" style="background: linear-gradient(135deg, var(--success) 0%, #66BB6A 100%);">孙</div>
        <div class="leave-info">
          <div class="leave-name">孙丽</div>
          <div class="leave-type">事假 · 昨天 16:00 申请</div>
        </div>
        <span class="leave-status status-approved">已批准</span>
      </div>
      <div class="leave-details">
        <div class="detail-item">
          <div class="detail-label">请假时间</div>
          <div>昨天 - 今天</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">请假天数</div>
          <div>2 天</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">请假原因</div>
          <div>家庭事务</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">家长电话</div>
          <div>135****7890</div>
        </div>
      </div>
      <div class="leave-actions">
        <button class="action-btn btn-detail">查看详情</button>
      </div>
    </div>

    <div class="leave-card">
      <div class="leave-header">
        <div class="leave-avatar" style="background: linear-gradient(135deg, var(--success) 0%, #66BB6A 100%);">周</div>
        <div class="leave-info">
          <div class="leave-name">周杰</div>
          <div class="leave-type">病假 · 2026-05-10</div>
        </div>
        <span class="leave-status status-approved">已销假</span>
      </div>
      <div class="leave-details">
        <div class="detail-item">
          <div class="detail-label">请假时间</div>
          <div>5 月 10 日 - 5 月 12 日</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">请假天数</div>
          <div>3 天</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">请假原因</div>
          <div>水痘隔离</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">销假时间</div>
          <div>5 月 13 日</div>
        </div>
      </div>
      <div class="leave-actions">
        <button class="action-btn btn-detail">查看详情</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function addLeave() { alert('添加请假记录功能'); }
  </script>
</body>
</html>
