<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排座位 - 班级助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .seating-container { background: white; border-radius: 12px; padding: 16px; }
    .seating-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 16px; }
    .seat { aspect-ratio: 1; border: 2px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .seat.occupied { background: var(--primary-light); border-color: var(--primary-color); color: var(--primary-color); }
    .seat.empty { background: var(--bg-color); }
    .seat:hover { transform: scale(1.05); }
    .seating-info { text-align: center; color: var(--text-secondary); font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="app-title">排座位</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" onclick="autoArrange()">自动排座</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>班级助手</h2>
        <p class="subtitle">绿茵校园·智慧班级</p>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-title">主功能</div>
          <a href="index.html" class="nav-item"><span class="nav-icon"></span><span>主页信息</span></a>
          <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span><span>学生管理</span></a>
          <a href="grades.html" class="nav-item"><span class="nav-icon">📈</span><span>成绩分析</span></a>
          <a href="discipline.html" class="nav-item"><span class="nav-icon">⚖️</span><span>违纪统计</span></a>
          <a href="homework.html" class="nav-item"><span class="nav-icon">📚</span><span>作业管理</span></a>
          <a href="leave.html" class="nav-item"><span class="nav-icon">🗓️</span><span>请销假</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">教学记录</div>
          <a href="worklog.html" class="nav-item"><span class="nav-icon">📝</span><span>工作留痕</span></a>
          <a href="talks.html" class="nav-item"><span class="nav-icon">💬</span><span>谈话记录</span></a>
          <a href="seating.html" class="nav-item active"><span class="nav-icon">🪑</span><span>排座位</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">AI 助手</div>
          <a href="ai-prepare.html" class="nav-item"><span class="nav-icon">🤖</span><span>智能备课</span></a>
          <a href="ai-analysis.html" class="nav-item"><span class="nav-icon">📊</span><span>学情分析</span></a>
          <a href="ai-comment.html" class="nav-item"><span class="nav-icon">✍️</span><span>评语生成</span></a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="teacher-info">
          <div class="teacher-avatar" id="teacherAvatar">李</div>
          <div>
            <div class="teacher-name" id="teacherName">李老师</div>
            <div class="teacher-role" id="teacherRole">班主任</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
      <div class="seating-container">
        <h3>座位表</h3>
        <div class="seating-grid" id="seatingGrid"></div>
        <div class="seating-info" id="seatingInfo"></div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    if (!classData.className || !classData.teacherName) {
      window.location.href = 'setup.html';
    }

    function updatePage() {
      document.getElementById('teacherName').textContent = (classData.teacherName || '老师') + '老师';
      document.getElementById('teacherRole').textContent = classData.className || '班主任';
      document.getElementById('teacherAvatar').textContent = (classData.teacherName || '老')[0];
      renderSeating();
    }

    function renderSeating() {
      const grid = document.getElementById('seatingGrid');
      const info = document.getElementById('seatingInfo');
      
      if (classData.students.length === 0) {
        grid.innerHTML = '<div class="empty-state">请先添加学生</div>';
        info.textContent = '';
        return;
      }

      const seats = classData.seating || [];
      const totalSeats = 42; // 默认 6x7 座位
      
      grid.innerHTML = '';
      for (let i = 0; i < totalSeats; i++) {
        const seat = document.createElement('div');
        seat.className = 'seat';
        
        if (seats[i]) {
          const student = classData.students.find(s => s.id === seats[i]);
          if (student) {
            seat.classList.add('occupied');
            seat.textContent = student.name;
            seat.onclick = () => clearSeat(i);
          }
        } else {
          seat.classList.add('empty');
          seat.textContent = '空';
          seat.onclick = () => assignSeat(i);
        }
        
        grid.appendChild(seat);
      }
      
      info.textContent = `已安排 ${seats.filter(s => s).length} / ${totalSeats} 个座位`;
    }

    function assignSeat(seatIndex) {
      const availableStudents = classData.students.filter(s => 
        !classData.seating.includes(s.id)
      );
      
      if (availableStudents.length === 0) {
        alert('所有学生都已安排座位');
        return;
      }
      
      const studentId = parseInt(prompt('输入学生 ID：'));
      const student = classData.students.find(s => s.id === studentId);
      
      if (!student) {
        alert('学生不存在');
        return;
      }
      
      if (classData.seating.includes(studentId)) {
        alert('该学生已有座位');
        return;
      }
      
      if (!classData.seating) classData.seating = [];
      classData.seating[seatIndex] = studentId;
      saveData();
      renderSeating();
    }

    function clearSeat(seatIndex) {
      if (confirm('清空这个座位？')) {
        classData.seating[seatIndex] = null;
        saveData();
        renderSeating();
      }
    }

    function autoArrange() {
      if (classData.students.length === 0) {
        alert('请先添加学生');
        return;
      }
      
      if (!confirm('自动排列所有学生座位？')) return;
      
      const shuffled = [...classData.students].sort(() => Math.random() - 0.5);
      classData.seating = shuffled.map(s => s.id);
      saveData();
      renderSeating();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    updatePage();
  </script>
</body>
</html>
