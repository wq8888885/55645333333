<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业管理 - 班级助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .homework-list { background: white; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .homework-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .homework-item:last-child { border-bottom: none; }
    .homework-info { flex: 1; }
    .homework-title { font-weight: 600; color: var(--text-primary); font-size: 16px; }
    .homework-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .homework-stats { text-align: right; }
    .homework-stats .count { font-size: 24px; font-weight: 600; color: var(--primary-color); }
    .homework-stats .label { font-size: 12px; color: var(--text-secondary); }
    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .list-view { display: block; }
    .list-view.hidden { display: none; }
    .student-submit-list { background: white; border-radius: 12px; padding: 16px; }
    .student-submit-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
    .student-submit-item:last-child { border-bottom: none; }
    .submit-status { padding: 4px 12px; border-radius: 4px; font-size: 12px; }
    .submit-status.submitted { background: #D4EDDA; color: #155724; }
    .submit-status.missing { background: #F8D7DA; color: #721C24; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="app-title" id="pageTitle">作业管理</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" id="addBtn" onclick="addHomework()">+ 发布作业</button>
          <button class="header-btn" id="backBtn" onclick="backToList()" style="display: none;">← 返回</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>班级助手</h2>
        <p class="subtitle">绿茵校园·智慧班级</p>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-title">主功能</div>
          <a href="index.html" class="nav-item"><span class="nav-icon">📊</span><span>主页信息</span></a>
          <a href="students.html" class="nav-item"><span class="nav-icon">👨‍🎓</span><span>学生管理</span></a>
          <a href="grades.html" class="nav-item"><span class="nav-icon">📈</span><span>成绩分析</span></a>
          <a href="discipline.html" class="nav-item"><span class="nav-icon">⚖️</span><span>违纪统计</span></a>
          <a href="homework.html" class="nav-item active"><span class="nav-icon">📚</span><span>作业管理</span></a>
          <a href="leave.html" class="nav-item"><span class="nav-icon">🗓️</span><span>请销假</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">教学记录</div>
          <a href="worklog.html" class="nav-item"><span class="nav-icon">📝</span><span>工作留痕</span></a>
          <a href="talks.html" class="nav-item"><span class="nav-icon">💬</span><span>谈话记录</span></a>
          <a href="seating.html" class="nav-item"><span class="nav-icon">🪑</span><span>排座位</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-title">AI 助手</div>
          <a href="ai-prepare.html" class="nav-item"><span class="nav-icon">🤖</span><span>智能备课</span></a>
          <a href="ai-analysis.html" class="nav-item"><span class="nav-icon">📊</span><span>学情分析</span></a>
          <a href="ai-comment.html" class="nav-item"><span class="nav-icon">✍️</span><span>评语生成</span></a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="teacher-info">
          <div class="teacher-avatar" id="teacherAvatar">李</div>
          <div>
            <div class="teacher-name" id="teacherName">李老师</div>
            <div class="teacher-role" id="teacherRole">班主任</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
      <div class="list-view" id="listView">
        <div class="homework-list" id="homeworkList">
          <div class="empty-state">暂无作业，点击"发布作业"开始</div>
        </div>
      </div>

      <div class="detail-view" id="detailView">
        <div class="student-submit-list" id="studentSubmitList"></div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    if (!classData.className || !classData.teacherName) {
      window.location.href = 'setup.html';
    }

    let currentHomeworkId = null;

    function updatePage() {
      document.getElementById('teacherName').textContent = (classData.teacherName || '老师') + '老师';
      document.getElementById('teacherRole').textContent = classData.className || '班主任';
      document.getElementById('teacherAvatar').textContent = (classData.teacherName || '老')[0];
      renderHomeworkList();
    }

    function renderHomeworkList() {
      const list = document.getElementById('homeworkList');
      
      if (classData.homeworks.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无作业，点击"发布作业"开始</div>';
        return;
      }
      
      list.innerHTML = classData.homeworks.map(hw => {
        const totalStudents = classData.students.length;
        const submittedCount = Object.values(hw.submissions || {}).length;
        const missingCount = totalStudents - submittedCount;
        const isOverdue = new Date(hw.deadline) < new Date();
        
        return `
          <div class="homework-item" onclick="viewHomeworkDetail(${hw.id})">
            <div class="homework-info">
              <div class="homework-title">${hw.title}</div>
              <div class="homework-meta">截止：${hw.deadline} ${isOverdue ? '(已过期)' : ''}</div>
            </div>
            <div class="homework-stats">
              <div class="count">${missingCount}</div>
              <div class="label">未交</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addHomework() {
      if (classData.students.length === 0) {
        alert('请先添加学生');
        return;
      }
      
      const title = prompt('作业标题：');
      if (!title) return;
      
      const description = prompt('作业描述（可选）：', '');
      const deadline = prompt('截止日期（格式：YYYY-MM-DD）：', new Date().toISOString().split('T')[0]);
      if (!deadline) return;
      
      classData.homeworks.push({
        id: Date.now(),
        title,
        description,
        deadline,
        submissions: {}
      });
      
      saveData();
      renderHomeworkList();
    }

    function viewHomeworkDetail(hwId) {
      currentHomeworkId = hwId;
      const hw = classData.homeworks.find(h => h.id === hwId);
      if (!hw) return;
      
      document.getElementById('pageTitle').textContent = hw.title;
      document.getElementById('addBtn').style.display = 'none';
      document.getElementById('backBtn').style.display = 'block';
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.add('active');
      
      renderStudentSubmitList(hw);
    }

    function renderStudentSubmitList(hw) {
      const list = document.getElementById('studentSubmitList');
      
      list.innerHTML = classData.students.map(student => {
        const submission = hw.submissions[student.id];
        const isSubmitted = !!submission;
        const submitTime = submission ? new Date(submission).toLocaleString('zh-CN') : '';
        
        return `
          <div class="student-submit-item">
            <div>
              <div class="student-name">${student.name}</div>
              ${isSubmitted ? `<div class="homework-meta">提交于 ${submitTime}</div>` : ''}
            </div>
            <button class="action-btn" onclick="toggleSubmit(${hw.id}, ${student.id})">
              ${isSubmitted ? '取消提交' : '标记提交'}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleSubmit(hwId, studentId) {
      const hw = classData.homeworks.find(h => h.id === hwId);
      if (!hw) return;
      
      if (hw.submissions[studentId]) {
        delete hw.submissions[studentId];
      } else {
        hw.submissions[studentId] = new Date().toISOString();
      }
      
      saveData();
      renderStudentSubmitList(hw);
      renderHomeworkList();
    }

    function backToList() {
      currentHomeworkId = null;
      document.getElementById('pageTitle').textContent = '作业管理';
      document.getElementById('addBtn').style.display = 'block';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('detailView').classList.remove('active');
      renderHomeworkList();
    }

    function deleteHomework(id) {
      if (confirm('确定删除这条作业吗？所有提交记录也将被清除。')) {
        classData.homeworks = classData.homeworks.filter(h => h.id !== id);
        saveData();
        renderHomeworkList();
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    updatePage();
  </script>
</body>
</html>
