<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班级助手 - 作业管理</title>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF8C69;
      --primary-light: #FFA88C;
      --bg: #FFF8F0;
      --bg-card: #FFFFFF;
      --bg-cream: #FFF5EB;
      --text-primary: #2D2D2D;
      --text-secondary: #6B6B6B;
      --text-muted: #999999;
      --border: #FFE8D6;
      --success: #4CAF50;
      --warning: #FF9800;
      --error: #F44336;
      --info: #2196F3;
      --shadow: 0 2px 12px rgba(255, 140, 105, 0.08);
      --radius: 16px;
      --radius-sm: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(255, 140, 105, 0.2);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .header-title { color: white; font-size: 18px; font-weight: 600; }
    .add-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .content { padding: 16px; }
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
    }
    .stat-box {
      background: var(--bg-card); border-radius: var(--radius); padding: 14px;
      text-align: center; box-shadow: var(--shadow);
    }
    .stat-num { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .stat-num.blue { color: var(--info); }
    .stat-num.orange { color: var(--warning); }
    .stat-num.green { color: var(--success); }
    .stat-label { font-size: 11px; color: var(--text-muted); }
    .homework-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .hw-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .hw-subject {
      display: flex; align-items: center; gap: 8px;
    }
    .hw-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .hw-icon.math { background: #E3F2FD; color: var(--info); }
    .hw-icon.chinese { background: #FFEBEE; color: var(--error); }
    .hw-icon.english { background: #E8F5E9; color: var(--success); }
    .hw-title { font-size: 15px; font-weight: 600; }
    .hw-badge {
      padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    }
    .badge-warning { background: #FFF3E0; color: var(--warning); }
    .badge-success { background: #E8F5E9; color: var(--success); }
    .hw-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
    .hw-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .hw-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .hw-action { font-size: 13px; color: var(--primary); cursor: pointer; font-weight: 500; }
    .unsubmitted-list { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .unsubmitted-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .unsubmitted-avatars { display: flex; gap: 6px; flex-wrap: wrap; }
    .unsubmitted-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--warning) 0%, #FFA726 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="header-title">作业管理</div>
    </div>
    <button class="add-btn" onclick="addHomework()">
      <i data-lucide="plus" class="w-5 h-5"></i>
    </button>
  </header>

  <div class="content">
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num blue">3</div>
        <div class="stat-label">今日作业</div>
      </div>
      <div class="stat-box">
        <div class="stat-num orange">9</div>
        <div class="stat-label">未交人数</div>
      </div>
      <div class="stat-box">
        <div class="stat-num green">33</div>
        <div class="stat-label">已交人数</div>
      </div>
    </div>

    <div class="homework-card">
      <div class="hw-header">
        <div class="hw-subject">
          <div class="hw-icon math">
            <i data-lucide="calculator" class="w-5 h-5"></i>
          </div>
          <div class="hw-title">数学·分数练习题</div>
        </div>
        <span class="hw-badge badge-warning">9 人未交</span>
      </div>
      <div class="hw-desc">第 42-45 页，完成练习 1-5 题</div>
      <div class="hw-footer">
        <div class="hw-meta">
          <i data-lucide="clock" class="w-4 h-4"></i>
          <span>截止：今天 18:00</span>
        </div>
        <span class="hw-action">查看 ›</span>
      </div>
      <div class="unsubmitted-list">
        <div class="unsubmitted-title">未交学生：</div>
        <div class="unsubmitted-avatars">
          <div class="unsubmitted-avatar">刘</div>
          <div class="unsubmitted-avatar">陈</div>
          <div class="unsubmitted-avatar">杨</div>
          <div class="unsubmitted-avatar">+6</div>
        </div>
      </div>
    </div>

    <div class="homework-card">
      <div class="hw-header">
        <div class="hw-subject">
          <div class="hw-icon chinese">
            <i data-lucide="book-open" class="w-5 h-5"></i>
          </div>
          <div class="hw-title">语文·课文背诵</div>
        </div>
        <span class="hw-badge badge-warning">2 人未交</span>
      </div>
      <div class="hw-desc">背诵《春晓》，家长签字确认</div>
      <div class="hw-footer">
        <div class="hw-meta">
          <i data-lucide="clock" class="w-4 h-4"></i>
          <span>截止：明天 08:00</span>
        </div>
        <span class="hw-action">查看 ›</span>
      </div>
      <div class="unsubmitted-list">
        <div class="unsubmitted-title">未交学生：</div>
        <div class="unsubmitted-avatars">
          <div class="unsubmitted-avatar">赵</div>
          <div class="unsubmitted-avatar">孙</div>
        </div>
      </div>
    </div>

    <div class="homework-card">
      <div class="hw-header">
        <div class="hw-subject">
          <div class="hw-icon english">
            <i data-lucide="languages" class="w-5 h-5"></i>
          </div>
          <div class="hw-title">英语·单词默写</div>
        </div>
        <span class="hw-badge badge-success">已收齐</span>
      </div>
      <div class="hw-desc">Unit 3 单词表，准备明天默写</div>
      <div class="hw-footer">
        <div class="hw-meta">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>已完成</span>
        </div>
        <span class="hw-action">查看 ›</span>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function addHomework() { alert('添加作业功能'); }
  </script>
</body>
</html>
