<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班级助手 - 评语生成</title>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF8C69; --primary-light: #FFA88C;
      --bg: #FFF8F0; --bg-card: #FFFFFF; --bg-cream: #FFF5EB;
      --text-primary: #2D2D2D; --text-secondary: #6B6B6B; --text-muted: #999999;
      --border: #FFE8D6; --success: #4CAF50; --warning: #FF9800; --error: #F44336;
      --info: #2196F3; --purple: #9C27B0;
      --shadow: 0 2px 12px rgba(255, 140, 105, 0.08);
      --radius: 16px; --radius-sm: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text-primary); min-height: 100vh; padding-bottom: 80px;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(255, 140, 105, 0.2);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: none;
      color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .header-title { color: white; font-size: 18px; font-weight: 600; }
    .content { padding: 16px; }
    .ai-banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px; color: white;
    }
    .ai-banner-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .ai-banner-desc { font-size: 13px; opacity: 0.9; }
    .student-selector {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .selector-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .student-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .student-chip {
      padding: 8px; border: 2px solid var(--border); border-radius: var(--radius-sm);
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .student-chip:hover { border-color: var(--primary); }
    .student-chip.selected { border-color: var(--primary); background: var(--bg-cream); }
    .student-chip-avatar {
      width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 4px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: 600;
    }
    .student-chip-name { font-size: 11px; color: var(--text-secondary); }
    .generate-section {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
    .form-select {
      width: 100%; padding: 10px 12px; border: none;
      background: var(--bg-cream); border-radius: var(--radius-sm);
      font-size: 13px; color: var(--text-primary);
    }
    .btn-generate {
      width: 100%; padding: 12px; border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border-radius: var(--radius); font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .result-section {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
    }
    .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .result-title { font-size: 15px; font-weight: 600; }
    .result-actions { display: flex; gap: 6px; }
    .result-btn {
      padding: 5px 10px; border: none; background: var(--bg-cream);
      border-radius: 14px; font-size: 11px; color: var(--text-secondary); cursor: pointer;
    }
    .result-content {
      font-size: 13px; line-height: 1.8; color: var(--text-secondary);
      padding: 12px; background: var(--bg-cream); border-radius: var(--radius-sm);
    }
    .placeholder { text-align: center; padding: 30px 20px; color: var(--text-muted); }
    .placeholder i { width: 40px; height: 40px; margin-bottom: 10px; opacity: 0.3; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="header-title">评语生成</div>
    </div>
  </header>

  <div class="content">
    <div class="ai-banner">
      <div class="ai-banner-title">
        <i data-lucide="message-square" class="w-5 h-5"></i>
        AI 评语生成
      </div>
      <div class="ai-banner-desc">基于学生数据，智能生成个性化评语</div>
    </div>

    <div class="student-selector">
      <div class="selector-title">选择学生</div>
      <div class="student-grid">
        <div class="student-chip selected">
          <div class="student-chip-avatar">张</div>
          <div class="student-chip-name">张小明</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">李</div>
          <div class="student-chip-name">李华</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">王</div>
          <div class="student-chip-name">王芳</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">赵</div>
          <div class="student-chip-name">赵强</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">刘</div>
          <div class="student-chip-name">刘洋</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">陈</div>
          <div class="student-chip-name">陈静</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">杨</div>
          <div class="student-chip-name">杨帆</div>
        </div>
        <div class="student-chip">
          <div class="student-chip-avatar">孙</div>
          <div class="student-chip-name">孙丽</div>
        </div>
      </div>
    </div>

    <div class="generate-section">
      <div class="form-group">
        <label class="form-label">评语类型</label>
        <select class="form-select">
          <option>期末评语</option>
          <option>月度评语</option>
          <option>专项评语（学习/纪律/品德）</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">评语风格</label>
        <select class="form-select">
          <option>鼓励为主</option>
          <option>客观中肯</option>
          <option>严格要求</option>
        </select>
      </div>
      <button class="btn-generate" onclick="generateComment()">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        生成评语
      </button>
    </div>

    <div class="result-section">
      <div class="result-header">
        <div class="result-title">生成结果</div>
        <div class="result-actions">
          <button class="result-btn">复制</button>
          <button class="result-btn">重新生成</button>
        </div>
      </div>
      <div class="placeholder">
        <i data-lucide="message-circle" class="w-10 h-10"></i>
        <p>选择学生后点击"生成评语"</p>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    document.querySelectorAll('.student-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.student-chip').forEach(c => c.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
    function generateComment() { alert('AI 评语生成功能：需要接入大模型 API'); }
  </script>
</body>
</html>
